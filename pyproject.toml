[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-debugger"
version = "0.1.0"
description = "Python debugger CLI for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["debugger", "cli", "dap", "coding-agents", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "click>=8.1",
    "debugpy>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
cc-debug = "cc_debugger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_debugger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
